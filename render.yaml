# Render Blueprint за Cakes by ELI
#
# Приложението е дълго живеещ Node процес с PostgreSQL и диск за качените
# снимки — точно това, което Render дава директно. Създайте Blueprint от този
# файл, попълнете маркираните променливи и деплойнете.
#
# Деплоят е самодостатъчен — нищо не се пуска ръчно от Render Shell:
#
#   build      npm ci  →  db:migrate  →  next build
#   pre-deploy db:migrate  →  db:seed  →  db:verify
#   start      npm start
#
# Миграциите са в build командата, защото `next build` чете от базата през
# generateMetadata(); без тях билдът пада с „relation site_settings does not
# exist“. Повтарят се и в pre-deploy, за да е приложена схемата и когато билдът
# е дошъл от кеша.

services:
  - type: web
    name: cakes-by-eli
    runtime: node
    plan: starter
    region: frankfurt
    branch: main

    buildCommand: npm ci && npm run db:migrate && npm run build

    # Изпълнява се след билда и преди новата версия да поеме трафик. Seed-ът е
    # идемпотентен: попълва само липсващото и не пипа редактирано от админа
    # съдържание. db:verify спира деплоя, ако базата е останала празна — така
    # Render запазва предишната версия вместо да пусне кух сайт.
    preDeployCommand: npm run db:migrate && npm run db:seed && npm run db:verify

    # The V8 old-space ceiling is set here rather than in `envVars`, because a
    # global NODE_OPTIONS would also apply to `next build` — which needs far
    # more than 350 MB and would fail. Node sizes its heap from the *host*'s
    # RAM, not the container's: measured 4 144 MB on a 15.7 GB machine while
    # this service is capped at 512. Without a ceiling V8 never feels pressure
    # and the cgroup killer arrives first, with no stack trace; with one, V8
    # collects in time and genuine heap exhaustion is reported as such.
    startCommand: NODE_OPTIONS=--max-old-space-size=350 npm start

    # Inert liveness probe. `/contacts` is force-dynamic and cost ~7 queries
    # plus a full render on every check, ~1 700 times a day.
    healthCheckPath: /api/health

    # Качените от админа снимки трябва да преживеят рестарт и нов деплой.
    # Само те живеят тук. Демо снимките (public/demo) са в Git и идват заедно с
    # билда — затова seed-ът не пише нищо извън този диск.
    disk:
      name: uploads
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: DATABASE_URL
        fromDatabase:
          name: cakes-by-eli-db
          property: connectionString

      # Подписва администраторската сесия. Render генерира случайна стойност.
      - key: SESSION_SECRET
        generateValue: true

      - key: SESSION_TTL_HOURS
        value: "12"

      # Memory telemetry from src/instrumentation.ts — one JSON line a minute,
      # counters only, no personal data. Keep it on for the first week of
      # observation, then remove this entry once the trend is understood.
      - key: MEMLOG
        value: "1"

      # Upload limits. 3 × 3 MB plus multipart overhead stays inside the 12 MB
      # serverActions body limit in next.config.ts; src/lib/env.ts refuses to
      # boot if that stops being true. The order form reads the same numbers,
      # so the interface and the server cannot disagree.
      - key: UPLOAD_MAX_FILE_MB
        value: "3"
      - key: UPLOAD_MAX_FILES
        value: "3"

      # --- Попълва се ръчно в Render Dashboard ---------------------------

      # Реалният домейн, напр. https://cakesbyeli.bg
      - key: APP_URL
        sync: false

      - key: ADMIN_EMAIL
        sync: false
      # Паролата в чист вид — с нея се влиза в /admin.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_KEY
        sync: false

      # Дискът по-горе прави локалното хранилище издръжливо.
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: public/uploads
      - key: STORAGE_PUBLIC_PREFIX
        value: /uploads

      - key: ECONT_ENVIRONMENT
        value: demo
      - key: ECONT_USERNAME
        sync: false
      - key: ECONT_PASSWORD
        sync: false
      - key: ECONT_SENDER_NAME
        sync: false
      - key: ECONT_SENDER_PHONE
        sync: false
      - key: ECONT_SENDER_AGENT_NAME
        sync: false
      - key: ECONT_SENDER_CITY_ID
        sync: false
      - key: ECONT_SENDER_CITY_NAME
        sync: false
      - key: ECONT_SENDER_POST_CODE
        sync: false
      - key: ECONT_SENDER_QUARTER
        sync: false
      - key: ECONT_SENDER_STREET
        sync: false
      - key: ECONT_SENDER_STREET_NUM
        sync: false
      - key: ECONT_SENDER_OTHER
        sync: false
      # Изпращане от офис на Еконт вместо вземане от адрес. Попълнен код на
      # офис замества адреса по-горе.
      - key: ECONT_SENDER_OFFICE_CODE
        sync: false

databases:
  - name: cakes-by-eli-db
    databaseName: cakesbyeli
    region: frankfurt
    plan: basic-256mb
