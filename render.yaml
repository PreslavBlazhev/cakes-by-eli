# Render Blueprint за Cakes by ELI
#
# Приложението е дълго живеещ Node процес с PostgreSQL и диск за качените
# снимки — точно това, което Render дава директно. Създайте Blueprint от този
# файл, попълнете маркираните променливи и деплойнете.
#
# Деплоят е самодостатъчен — нищо не се пуска ръчно от Render Shell:
#
#   build      npm ci  →  db:migrate  →  next build
#   pre-deploy db:migrate  →  db:seed  →  db:verify
#   start      npm start
#
# Миграциите са в build командата, защото `next build` чете от базата през
# generateMetadata(); без тях билдът пада с „relation site_settings does not
# exist“. Повтарят се и в pre-deploy, за да е приложена схемата и когато билдът
# е дошъл от кеша.

services:
  - type: web
    name: cakes-by-eli
    runtime: node
    plan: starter
    region: frankfurt
    branch: main

    buildCommand: npm ci && npm run db:migrate && npm run build

    # Изпълнява се след билда и преди новата версия да поеме трафик. Seed-ът е
    # идемпотентен: попълва само липсващото и не пипа редактирано от админа
    # съдържание. db:verify спира деплоя, ако базата е останала празна — така
    # Render запазва предишната версия вместо да пусне кух сайт.
    preDeployCommand: npm run db:migrate && npm run db:seed && npm run db:verify

    startCommand: npm start

    healthCheckPath: /contacts

    # Качените от админа снимки трябва да преживеят рестарт и нов деплой.
    # Само те живеят тук. Демо снимките (public/demo) са в Git и идват заедно с
    # билда — затова seed-ът не пише нищо извън този диск.
    disk:
      name: uploads
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: DATABASE_URL
        fromDatabase:
          name: cakes-by-eli-db
          property: connectionString

      # Подписва администраторската сесия. Render генерира случайна стойност.
      - key: SESSION_SECRET
        generateValue: true

      - key: SESSION_TTL_HOURS
        value: "12"

      # --- Попълва се ръчно в Render Dashboard ---------------------------

      # Реалният домейн, напр. https://cakesbyeli.bg
      - key: APP_URL
        sync: false

      - key: ADMIN_EMAIL
        sync: false
      # Генерира се локално с:  npm run admin:hash -- "паролата"
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_NAME
        sync: false

      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_KEY
        sync: false

      # Дискът по-горе прави локалното хранилище издръжливо.
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: public/uploads
      - key: STORAGE_PUBLIC_PREFIX
        value: /uploads

      - key: ECONT_ENVIRONMENT
        value: demo
      - key: ECONT_USERNAME
        sync: false
      - key: ECONT_PASSWORD
        sync: false
      - key: ECONT_SENDER_NAME
        sync: false
      - key: ECONT_SENDER_PHONE
        sync: false
      - key: ECONT_SENDER_AGENT_NAME
        sync: false
      - key: ECONT_SENDER_CITY_ID
        sync: false
      - key: ECONT_SENDER_CITY_NAME
        sync: false
      - key: ECONT_SENDER_POST_CODE
        sync: false
      - key: ECONT_SENDER_STREET
        sync: false
      - key: ECONT_SENDER_STREET_NUM
        sync: false
      - key: ECONT_SENDER_OTHER
        sync: false

databases:
  - name: cakes-by-eli-db
    databaseName: cakesbyeli
    region: frankfurt
    plan: basic-256mb
